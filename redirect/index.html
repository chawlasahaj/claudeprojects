<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coach Sahaj has moved</title>
  <script>
    // The app moved to /coach/. Carry the client's ?u= link across and retire this
    // address's offline copy (only this one: other github.io sites share the origin).
    (function () {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) {
            if (/\/claudeprojects\/$/.test(r.scope)) r.unregister();
          });
        });
      }
      // Relative, so it keeps working whatever the GitHub username is.
      location.replace("../coach/" + location.search);
    })();
  </script>
</head>
<body>
  <p>Coach Sahaj has moved. <a href="../coach/">Open the new address</a>.</p>
</body>
</html>
