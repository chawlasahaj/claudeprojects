<!doctype html>
<html lang="en-SG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Managing Agents in Singapore</title>
  <meta name="description" content="Every managing agent on BCA's list of MCSTs, with how many developments each manages and where.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <h1>Managing agents</h1>
    <p class="lede" id="intro">Every managing agent named on BCA's list of MCSTs.</p>
    <div id="no-data"></div>
    <div class="fields no-print" id="controls">
      <div class="field"><label for="q">Search</label><input id="q" type="search" placeholder="Firm name"></div>
      <div class="field" id="type-field">
        <label for="type">Developments</label>
        <select id="type"><option value="all">All types</option><option value="home">Homes: condos and apartments</option><option value="commercial">Offices and shops</option><option value="industrial">Industrial</option></select>
      </div>
      <div class="field">
        <label for="sort">Sort by</label>
        <select id="sort">
          <option value="count">Most developments</option>
          <option value="units">Most strata lots</option>
          <option value="name">Name</option>
          <option value="net">Net clients won</option>
        </select>
      </div>
      <div class="field">
        <label for="min">Show</label>
        <select id="min"><option value="1">All firms</option><option value="3">3 or more developments</option><option value="10">10 or more developments</option></select>
      </div>
    </div>
    <p class="muted" id="count"></p>
    <div class="card" style="padding: 0" id="list"></div>
  </main>
  <script type="module">
    import { chrome, $, esc, loadMeta, loadAgents, fmtInt, fmtMonth, NO_DATA, store } from "./app.js";
    import { districtLabel } from "./lib/geo.js";
    import { USE_LABELS, groupCount } from "./lib/use.js";
    chrome("agents");

    const [meta, agents] = await Promise.all([loadMeta(), loadAgents()]);
    if (!agents) {
      $("#no-data").innerHTML = NO_DATA;
      $("#controls").hidden = true;
      $("#list").hidden = true;
    } else {
      const hasHistory = !!meta?.history;
      const hasTypes = !!meta?.landUse;
      $("#type-field").hidden = !hasTypes;
      $("#intro").textContent = `All ${fmtInt(agents.length)} managing agents named on BCA's list of MCSTs, with how many developments each runs and where. Tap a firm for its full portfolio.`;
      const state = { q: "", sort: "count", min: "1", type: "all", ...store.get("agentsView", {}) };
      if (!hasTypes) state.type = "all";
      $("#q").value = state.q;
      $("#type").value = state.type;
      $("#sort").value = state.sort;
      $("#min").value = state.min;
      if (!hasHistory) $("#sort").querySelector('[value="net"]').remove();

      const net = (a) => (a.history ? a.history.gained - a.history.lost : 0);
      const topDistricts = (a) => Object.entries(a.districts).sort((x, y) => y[1] - x[1]).slice(0, 2).map(([d]) => districtLabel(Number(d))).join("; ");
      const split = (a) => Object.entries(a.byUse ?? {}).filter(([, n]) => n).map(([u, n]) => `${fmtInt(n)} ${USE_LABELS[u].toLowerCase()}`).join(" · ");
      const HEADS = { all: "Developments", home: "Homes", commercial: "Offices, shops", industrial: "Industrial" };

      function draw() {
        Object.assign(state, { q: $("#q").value, sort: $("#sort").value, min: $("#min").value, type: $("#type").value });
        store.set("agentsView", state);
        const q = state.q.trim().toLowerCase();
        const n = (a) => groupCount(a, state.type);
        const rows = agents
          .filter((a) => n(a) >= Math.max(1, Number(state.min)))
          .filter((a) => !q || a.name.toLowerCase().includes(q) || a.spellings.some((s) => s.toLowerCase().includes(q)))
          .sort((a, b) =>
            state.sort === "name" ? a.name.localeCompare(b.name)
            : state.sort === "units" ? b.units - a.units
            : state.sort === "net" ? net(b) - net(a) || n(b) - n(a)
            : n(b) - n(a) || b.count - a.count);
        $("#count").textContent = `${fmtInt(rows.length)} firm${rows.length === 1 ? "" : "s"}`;
        $("#list").innerHTML =
          `<div class="agent-row head"><span>Firm</span><span class="num">${HEADS[state.type]}</span><span class="num">Strata lots</span><span class="num">${hasHistory ? `Since ${fmtMonth(meta.history.since)}` : "Accredited"}</span></div>` +
          rows.map((a) => `<div class="agent-row">
            <div><a href="agent.html?id=${esc(a.id)}"><b>${esc(a.name)}</b></a> ${a.accredited ? '<span class="badge">AMA</span>' : ""}<br><small class="muted">${esc(topDistricts(a))}</small>${hasTypes ? `<br><small class="muted">${esc(split(a))}</small>` : ""}</div>
            <div class="num"><b>${fmtInt(n(a))}</b></div>
            <div class="num hide-sm">${fmtInt(a.units)}</div>
            <div class="num hide-sm">${hasHistory ? (a.history ? `+${a.history.gained} / −${a.history.lost}` : "–") : a.accredited ? "AMA" : "–"}</div>
          </div>`).join("");
      }
      for (const id of ["q", "type", "sort", "min"]) $(`#${id}`).addEventListener("input", draw);
      draw();
    }
  </script>
</body>
</html>
