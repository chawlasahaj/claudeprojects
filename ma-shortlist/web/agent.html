<!doctype html>
<html lang="en-SG" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Managing Agent Profile</title>
  <meta name="description" content="A managing agent's condos in Singapore: how many it runs, where they are, and which councils have switched to or from it.">
  <meta property="og:title" content="Managing Agent Profile · StrataMatch">
  <meta property="og:description" content="A managing agent's condos in Singapore: how many it runs, where they are, and which councils have switched to or from it.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="StrataMatch">
  <meta property="og:image" content="https://stratamatch.pages.dev/images/og-banner.jpg">
  <meta property="og:image:secure_url" content="https://stratamatch.pages.dev/images/og-banner.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="627">
  <meta property="og:image:alt" content="StrataMatch: Changing managing agent? Start with a fair shortlist.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap" id="page">
    <p><a href="agents.html">← All agents</a></p>
    <div id="body"></div>
  </main>
  <script type="module">
    import { chrome, $, esc, loadMeta, loadAgents, loadMcsts, fmtInt, fmtMonth, fmtDate, plural, picks, NO_DATA } from "./app.js";
    import { postalDistrict, districtLabel } from "./lib/geo.js";
    chrome("agents");

    const id = new URLSearchParams(location.search).get("id");
    const [meta, agents, mcsts] = await Promise.all([loadMeta(), loadAgents(), loadMcsts()]);
    const firm = agents?.find((a) => a.id === id);
    const body = $("#body");

    if (!agents || !mcsts) body.innerHTML = NO_DATA;
    else if (!firm) body.innerHTML = `<div class="notice">We couldn't find that agent. It may have been renamed or merged. <a href="agents.html">See all agents</a>.</div>`;
    else render();

    function render() {
      document.title = `${firm.name} · StrataMatch`;
      const nameOf = new Map(agents.map((a) => [a.id, a.name]));
      const byKey = new Map(mcsts.map((m) => [m.key, m]));
      const own = mcsts.filter((m) => m.firm === firm.id);
      const max = Math.max(...Object.values(firm.districts));
      const districts = Object.entries(firm.districts).sort((a, b) => b[1] - a[1]);
      const h = firm.history;
      const mv = firm.moves ?? { in: [], out: [] };
      const acc = meta.accreditation;
      const phone = firm.accredited?.phone;
      const accText = firm.accredited
        ? `On the AMA (Registered) list${firm.accredited.category ? `, Category ${esc(firm.accredited.category)}` : ""}.${phone ? ` Office: <a href="tel:+65${esc(phone.replace(/\D/g, ""))}">${esc(phone)}</a>, as listed by SISV.` : ""}`
        : acc?.complete
          ? `Not on the AMA (Registered) list when we last checked${acc.checked ? ` (${esc(fmtDate(acc.checked))})` : ""}.`
          : `Not on our copy of the AMA (Registered) list, which isn't complete yet. <a href="${esc(acc?.source ?? "https://www.sisv.org.sg/ama-Registered-list.aspx")}" rel="noopener">Check the SISV list</a>.`;
      const devName = (key) => byKey.get(key)?.name ?? `MCST ${key}`;

      body.innerHTML = `
        <div class="btn-row" style="justify-content: space-between; align-items: flex-start">
          <div>
            <h1 style="margin-bottom: 4px">${esc(firm.name)}</h1>
            <p class="muted" style="margin: 0">${accText}</p>
          </div>
          <div class="btn-row no-print">
            <button class="btn" id="pick" type="button"></button>
            <a class="btn quiet" href="https://www.google.com/search?q=${encodeURIComponent(`${firm.name} Singapore managing agent contact`)}" target="_blank" rel="noopener">Find contact details</a>
          </div>
        </div>

        <div class="stats">
          <div class="stat"><b>${fmtInt(firm.count)}</b><span>condos managed</span></div>
          <div class="stat"><b>${fmtInt(firm.units)}</b><span>strata lots in them</span></div>
          <div class="stat"><b>${districts.length}</b><span>postal districts</span></div>
          ${h ? `<div class="stat"><b>+${h.gained} / −${h.lost}</b><span>clients won / lost since ${esc(fmtMonth(meta.history.since))}</span></div>` : ""}
        </div>

        <div class="grid grid-2">
          <section class="card">
            <h2 style="margin-top: 0">Where its developments are</h2>
            <ul class="bars">${districts.map(([d, n]) => `<li><span>${esc(districtLabel(Number(d)))}</span><span class="num">${n}</span><span class="bar"><i style="width: ${(n / max) * 100}%"></i></span></li>`).join("")}</ul>
          </section>
          <section class="card">
            <h2 style="margin-top: 0">Recent changes</h2>
            ${h ? `
              ${mv.out.length ? `<h3>Left this agent</h3><ul>${mv.out.map((m) => `<li>${esc(devName(m.key))} → ${m.to ? `<a href="agent.html?id=${esc(m.to)}">${esc(nameOf.get(m.to) ?? m.to)}</a>` : "no agent listed"}</li>`).join("")}</ul>
                <p class="muted">Councils that left can tell you why. Write to them, care of the management office.</p>` : `<p>No developments left this agent between ${esc(fmtDate(meta.history.since))} and ${esc(fmtDate(meta.history.until))}.</p>`}
              ${mv.in.length ? `<h3>Switched to this agent</h3><ul>${mv.in.map((m) => `<li>${esc(devName(m.key))}${m.from ? ` (from ${esc(nameOf.get(m.from) ?? m.from)})` : ""}</li>`).join("")}</ul>` : ""}
              ${h.newDevelopments ? `<p class="muted">Also took on ${plural(h.newDevelopments, "newly formed MCST")}.</p>` : ""}`
              : `<p class="muted">We started tracking switches between agents ${meta.history ? `in ${esc(fmtMonth(meta.history.since))}` : "recently"}. Changes will show here after the next monthly update.</p>`}
          </section>
        </div>

        <h2>Condos managed (${fmtInt(own.length)})</h2>
        <div class="field no-print" style="max-width: 360px"><label for="filter">Filter</label><input id="filter" type="search" placeholder="Name or postal code"></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Development</th><th>MCST</th><th class="num">Lots</th><th>District</th></tr></thead>
          <tbody id="devs"></tbody>
        </table></div>
        ${firm.spellings.length > 1 ? `<p class="muted" style="margin-top: 12px">BCA's list spells this firm ${firm.spellings.length} ways: ${firm.spellings.map(esc).join("; ")}.</p>` : ""}`;

      const pickBtn = $("#pick");
      const label = () => (pickBtn.textContent = picks.has(firm.id) ? "✓ Invited to quote" : "Invite to quote");
      label();
      pickBtn.addEventListener("click", () => (picks.toggle(firm), label()));

      const draw = () => {
        const q = $("#filter").value.trim().toLowerCase();
        $("#devs").innerHTML = own
          .filter((m) => !q || m.name.toLowerCase().includes(q) || m.postal.includes(q))
          .map((m) => `<tr><td>${esc(m.name)}<br><small class="muted">${esc(m.address || m.postal)}</small></td><td>${esc(m.mcst)}</td><td class="num">${fmtInt(m.lots)}</td><td>D${String(postalDistrict(m.postal) ?? "–").padStart(2, "0")}</td></tr>`)
          .join("");
      };
      $("#filter").addEventListener("input", draw);
      draw();
    }
  </script>
</body>
</html>
