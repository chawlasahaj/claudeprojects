# Tests the workout tracker on every pull request, and publishes workout-tracker/web
# to GitHub Pages (https://chawlasahaj.github.io/claudeprojects/) on every push to main.
name: Workout tracker

on:
  push:
    branches: [main]
    paths: ["workout-tracker/**", ".github/workflows/workout-tracker.yml"]
  pull_request:
    paths: ["workout-tracker/**", ".github/workflows/workout-tracker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workout-tracker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time; a newer push waits rather than cutting one off halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: workout-tracker/web
      - id: deployment
        uses: actions/deploy-pages@v4
